[package]
name = "vnc-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["rusty-h264"]
rusty-h264 = ["dep:rusty_h264-encoder", "dep:rusty_h264-common"]
v4l2m2m = []
v4l2-sys = []

[dependencies]
vnc-protocol = { path = "../vnc-protocol", features = ["jpeg-encode"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
ctrlc = "3.4"
evdev = "0.13"
des = "0.9"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
bitflags = "2.6"
nix = { version = "0.30", features = ["signal", "socket", "fs", "mman", "ioctl"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-pemfile = "2.0"
rcgen = "0.13"
rayon = "1.10"
rusty_h264-encoder = { version = "0.8", optional = true }
rusty_h264-common = { version = "0.8", optional = true }

wayland-client = { version = "0.31", features = ["dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
libc = "0.2.189"
