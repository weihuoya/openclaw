[package]
name = "vnc-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared RFB protocol types and constants for vnc-client and vnc-server"

[features]
# Enable the Tight JPEG subencoding decoder.
jpeg = ["dep:jpeg-decoder"]
# Enable the Tight JPEG subencoding encoder (server side).
jpeg-encode = ["dep:jpeg-encoder"]

[dependencies]
thiserror = "2.0"
log = "0.4"
byteorder = "1.5"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
jpeg-decoder = { version = "0.3", optional = true }
jpeg-encoder = { version = "0.7", optional = true }
des = "0.9"
rand = "0.8"
rsa = "0.9"
aes = "0.8"
ctr = "0.9"
sha2 = "0.10"
