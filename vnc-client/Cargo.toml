[package]
name = "vnc-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A Rust VNC client library implementing the RFB protocol"

[dependencies]
vnc-protocol = { path = "../vnc-protocol", features = ["jpeg"] }
thiserror = "2.0"
log = "0.4"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
des = "0.9"
cipher = "0.5"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "0.26"
rsa = "0.9"
aes = "0.8"
ctr = "0.9"
md5 = "0.7"
num-bigint = { version = "0.4", features = ["rand"] }
rand = "0.8"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
cbc = "0.1"
ecb = "0.1"
sasl = { version = "0.5.2", features = ["scram"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

# Platform-specific video decoder backends
[target.'cfg(not(target_os = "android"))'.dependencies]
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-video = "0.23"
# SO_RCVBUF tuning for the Apple HP media stream (large tile bursts).
socket2 = "0.5"

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", features = ["media"] }

[dev-dependencies]
# Used only by tests/zrle_trle_server_roundtrip.rs to verify that the client
# decoders accept the server encoders' output. No dependency cycle: vnc-server
# does not depend on vnc-client.
vnc-server = { path = "../vnc-server" }
env_logger = "0.11"
